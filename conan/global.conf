# Global configuration for Conan, installed by conan/init.sh.
core:non_interactive=True
core.download:parallel={{ os.cpu_count() }}
core.upload:parallel={{ os.cpu_count() }}
# Rate-limited/flaky source downloads (e.g. secp256k1's tarball from github.com):
# ~2.5 min total retry window; free on healthy runs.
tools.files.download:retry=5
tools.files.download:retry_wait=30
